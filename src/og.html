<!doctype html>
<!-- Bron van docs/assets/img/og.png (de afbeelding bij een gedeelde link: WhatsApp, Facebook, LinkedIn).
     Compositie zoals de startpagina: de SVG-nachtstad van de SVG-route (docs/assets/img/plattegrond.svg) met het
     uithangbord op het landmark, verlicht met 'Jouw zaak' in Panchang-cyaan, en linksonder het vlakke aankomstpaneel
     met wat STS is. Fonts en stad komen via relatieve paden uit docs/, dus dit bestand werkt rechtstreeks vanaf schijf.
     Lokale stap (na elke wijziging hier of aan de skyline): node scripts/og-render.mjs
     Dat script opent dit bestand in Chromium op 1200x630, wacht op de fonts, schrijft docs/assets/img/og.png en
     controleert de maat (1200x630) en het gewicht (onder 300 kB). Tekst hier volgt copy-regels.md. -->
<html lang="nl-BE"><head><meta charset="utf-8">
<title>og.png: Jouw zaak op het bord</title>
<link rel="stylesheet" href="../docs/assets/css/fonts.css">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#06080F;color:#F2F5FF}
  .wrap{position:relative;width:1200px;height:630px;overflow:hidden}
  /* de stad: 1,3 keer de viewBox van 1200x800, zo gelegd dat het bord gecentreerd boven het landmark staat */
  .stad{position:absolute;left:-180px;top:-150px;width:1560px;height:1040px;display:block}
  /* het bord: de rechthoek van #landmark-bord (440..760 x 190..276 in de viewBox) na die schaal */
  .bord{position:absolute;left:392px;top:97px;width:416px;height:112px;display:grid;place-items:center;
    font:700 46px/1 'Panchang','Unbounded',sans-serif;letter-spacing:.01em;color:#36E8FF;white-space:nowrap;
    text-shadow:0 0 18px #36E8FF,0 0 48px rgba(54,232,255,.55)}
  .gloed{position:absolute;left:342px;top:47px;width:516px;height:212px;border-radius:50%;
    background:radial-gradient(closest-side,rgba(54,232,255,.22),rgba(54,232,255,0))}
  /* het aankomstpaneel: vlak, 1px lijn, zoals .gevel-aankomst op de startpagina */
  .paneel{position:absolute;left:72px;bottom:64px;width:580px;padding:30px 34px 28px;box-sizing:border-box;
    background:rgba(6,8,15,.92);border:1px solid rgba(242,245,255,.14);border-radius:22px}
  .label{font:500 14px/1 'JetBrains Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:rgba(242,245,255,.52)}
  h1{margin:16px 0 0;font:600 34px/1.18 'Panchang','Unbounded',sans-serif;letter-spacing:-.005em}
  p{margin:14px 0 0;font:400 20px/1.45 'Switzer',system-ui,sans-serif;color:rgba(242,245,255,.74);max-width:30em}
  .merk{position:absolute;right:72px;bottom:64px;text-align:right;padding:16px 20px;border-radius:16px;background:rgba(6,8,15,.8)}
  .brand{font:600 22px/1 'Panchang','Unbounded',sans-serif;letter-spacing:.04em;display:flex;align-items:center;justify-content:flex-end;gap:10px}
  .st{display:inline-block;width:10px;height:10px;background:#36E8FF;clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%)}
  .slogan{margin-top:14px;font:500 13px/1 'JetBrains Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:rgba(242,245,255,.5)}
</style></head>
<body><div class="wrap">
  <img class="stad" src="../docs/assets/img/plattegrond.svg" alt="">
  <div class="gloed"></div>
  <div class="bord">Jouw zaak</div>
  <div class="paneel">
    <div class="label">STS Digital &middot; Antwerpen</div>
    <h1>Websites met eerst een gratis voorbeeld.</h1>
    <p>Typ de naam van je zaak op het bord. Gratis gereedschap en onderzoek naar AI die werk overneemt van kleine zaken. Snymis leest elk bericht zelf.</p>
  </div>
  <div class="merk">
    <div class="brand">STAR<span class="st"></span>TEC<span class="st"></span>SOLUTIONS</div>
    <div class="slogan">Where imagination can reach up to the stars.</div>
  </div>
</div></body></html>
