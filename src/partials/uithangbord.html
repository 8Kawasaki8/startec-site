<!-- Uithangbord: de ene navigatie, op elke pagina, gerenderd door scripts/build.py uit DOORS en ACTION
     (buildlib.py): {{doors}} = vijf deuren in de taal van de uitbater, {{action}} = de ene actie 'Bericht aan
     Snymis', beide met aria-current op de pagina waar de bezoeker staat. De naamchip toont de gedeelde staat
     (sts-zaak) en opent het bewerkblad; uithangbord.js (docs/assets/js) doet de rest. Onder 900 px zet dat
     script dit blok achteraan in de DOM: de kop blijft boven, het dock staat onderaan. Elke deur en de actie
     dragen twee labels (.ub-lang, .ub-kort uit DOORS/ACTION); het dock toont de korte. -->
<header class="uithangbord">
  <nav class="ub" aria-label="Uithangbord">
    <div class="ub-kop">
      <a class="ub-merk" href="{{home}}" aria-label="Star.Tec.Solutions, naar de startpagina">

        <span>Star<span class="st" aria-hidden="true"></span>Tec<span class="st" aria-hidden="true"></span>Solutions</span>
      </a>
      <button class="ub-chip is-leeg" type="button" aria-expanded="false" aria-controls="ub-sheet" data-ub-chip>
        <span class="st" aria-hidden="true"></span>
        <span class="ub-chip-txt" data-ub-chip-txt>Hoe heet je zaak?</span>
        <span class="sr">, naam van je zaak aanpassen</span>
      </button>
    </div>
    <div class="ub-dok">
      <ul class="ub-deuren scroller">
{{doors}}
      </ul>
      {{action}}
    </div>
  </nav>
  <div class="ub-sheet" id="ub-sheet" role="dialog" aria-modal="true" aria-labelledby="ub-sheet-titel" hidden>
    <form data-ub-form novalidate>
      <p class="label" id="ub-sheet-titel">Jouw zaak op het bord</p>
      <label class="field"><span>Naam van je zaak</span><input name="zaak" maxlength="40" autocomplete="organization" placeholder="Bijvoorbeeld: Frituur 't Pleintje"></label>
      <fieldset class="keuze">
        <legend>Wat voor zaak?</legend>
        <label><input type="radio" name="sector" value="horeca"><span>Horeca</span></label>
        <label><input type="radio" name="sector" value="kapper"><span>Kapper</span></label>
        <label><input type="radio" name="sector" value="garage"><span>Garage</span></label>
        <label><input type="radio" name="sector" value="bakker"><span>Bakker</span></label>
        <label><input type="radio" name="sector" value="aannemer"><span>Aannemer</span></label>
        <label><input type="radio" name="sector" value="praktijk"><span>Praktijk</span></label>
        <label><input type="radio" name="sector" value="winkel"><span>Winkel</span></label>
        <label><input type="radio" name="sector" value="anders"><span>Andere zaak</span></label>
      </fieldset>
      <label class="field"><span>Gemeente of district</span><input name="gemeente" maxlength="30" autocomplete="address-level2" list="ub-gemeenten" placeholder="Bijvoorbeeld: Deurne"></label>
      <datalist id="ub-gemeenten" data-gemeenten></datalist>
      <div class="ub-sheet-acties">
        <button class="pill" type="submit">Zet op het bord</button>
        <button class="btn" type="button" data-ub-wis>Wis</button>
        <button class="btn ub-lite" type="button" role="switch" aria-checked="false" data-lite-switch>Minder animatie <i data-lite-state>uit</i></button>
      </div>
      <p class="note">Blijft in je browser en verdwijnt als je het tabblad sluit. We sturen niets. Minder animatie zet de stad en de animaties uit, net als de knop in de voet.</p>
    </form>
  </div>
</header>
