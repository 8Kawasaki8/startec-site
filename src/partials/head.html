<!-- WP-16: {{preloads}} is one <link rel=preload> per font file of the page's first viewport (front matter 'preload:',
     default in build.py: the sign and the H1 in Panchang, the arrival lines in Switzer; the labels in JetBrains Mono
     are small and load on discovery). Stylesheets stay render-blocking on purpose (critical CSS first, no FOUC);
     every script sits at the end of the body, after all content (no defer: the scene module must find gsap, see
     build.py), the scene loader is the only inline script.
     WP-26: without JavaScript every page is plain content: the <noscript> block hides the dead controls (name chip,
     'Minder animatie') and says in one line what needs scripts (the sketch on the sign, the simulations, the tools and
     the form); the scene partial unhides the SVG skyline itself. The line is first in <main>'s flow, under the strip. -->
<!doctype html>
<html lang="nl-BE" class="js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
{{robots}}
<meta name="theme-color" content="#06080F">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
{{og}}
{{jsonld}}
{{preloads}}
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="assets/css/fonts.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/uithangbord.css">
{{styles}}
</head>
<body>
<a class="skip" href="#main">Naar de inhoud</a>
<noscript><style>.ub-chip,[data-lite-toggle]{display:none}</style><p class="nojs">Zonder JavaScript zie je deze pagina als gewone tekst. De schets op het bord, de simulaties, het gereedschap en het formulier hebben JavaScript nodig; de deuren van het uithangbord werken gewoon.</p></noscript>
