<!-- WP-16: {{preloads}} is one <link rel=preload> per font file of the page's first viewport (front matter 'preload:',
     default in build.py: the sign and the H1 in Panchang, the arrival lines in Switzer; the labels in JetBrains Mono
     are small and load on discovery). Stylesheets stay render-blocking on purpose (critical CSS first, no FOUC);
     every script sits at the end of the body, after all content (no defer: the scene module must find gsap, see
     build.py), the scene loader is the only inline script. -->
<!doctype html>

{{robots}}

<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">

{{jsonld}}

<link rel="stylesheet" href="assets/css/fonts.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/uithangbord.css">
{{styles}}
</head>
